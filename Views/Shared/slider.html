<section class="slider-section" aria-labelledby="slider-title">
    <h2 id="slider-title">Города LifeSpot</h2>
    <div class="slider"
         role="region"
         aria-roledescription="карусель"
         aria-label="Фотографии городов">
        <div class="slides">
            <figure class="slide">
                <img src="/Static/Images/city-blue.svg"
                     alt="Силуэт вечернего города в синих тонах">
                <figcaption>Вечерний город</figcaption>
            </figure>
            <figure class="slide" hidden>
                <img src="/Static/Images/city-sunset.svg"
                     alt="Городской пейзаж на фоне заката">
                <figcaption>Закат над улицами</figcaption>
            </figure>
            <figure class="slide" hidden>
                <img src="/Static/Images/city-green.svg"
                     alt="Современный город рядом с парком">
                <figcaption>Город и природа</figcaption>
            </figure>
        </div>
        <div class="slider-controls">
            <button id="previous-slide"
                    class="slider-control"
                    type="button"
                    aria-label="Предыдущий слайд">
                ← Назад
            </button>
            <button id="next-slide"
                    class="slider-control"
                    type="button"
                    aria-label="Следующий слайд">
                Вперёд →
            </button>
        </div>
    </div>
</section>
